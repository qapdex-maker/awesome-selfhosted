<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SELFHOST.OS — Free Software you can run yourself</title>
<meta name="description" content="A curated index of self-hostable Free Software. Own your stack."/>
<style>
  :root{
    --bg:#070b14; --panel:#0d1422; --panel2:#111c30; --line:#1d2c44;
    --ink:#dce6f5; --muted:#7d90b0; --cyan:#2de2e6; --pink:#ff2e88;
    --green:#39d98a; --amber:#ffb454; --purple:#b14aed;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(45,226,230,.08), transparent 60%),
      radial-gradient(900px 500px at 0% 0%, rgba(255,46,136,.07), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:"Inter",system-ui,Segoe UI,Roboto,sans-serif;
    min-height:100vh;
  }
  /* blueprint grid overlay */
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
    background-image:linear-gradient(rgba(45,226,230,.06) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(45,226,230,.06) 1px,transparent 1px);
    background-size:42px 42px; mask:radial-gradient(circle at 50% 30%,#000,transparent 85%);
  }
  .wrap{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:34px 20px 80px;}

  header{display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; margin-bottom:8px;}
  .brand{font-family:"JetBrains Mono",ui-monospace,monospace; font-weight:800; letter-spacing:2px;}
  .brand .os{color:var(--cyan); text-shadow:0 0 18px rgba(45,226,230,.5);}
  .brand .dot{color:var(--pink);}
  h1{font-size:clamp(26px,4.4vw,44px); margin:0; line-height:1; filter:drop-shadow(0 0 22px rgba(45,226,230,.25));}
  .tagline{color:var(--muted); margin:8px 0 0; font-size:14px; max-width:560px; line-height:1.6;}
  .stats{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--muted); text-align:right;}
  .stats b{color:var(--green)}

  .controls{position:sticky; top:0; z-index:5; margin:26px 0 22px; padding:14px;
    background:rgba(7,11,20,.82); backdrop-filter:blur(8px);
    border:1px solid var(--line); border-radius:14px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
  #q{flex:1; min-width:220px; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:11px 14px; border-radius:10px; font-size:14px; font-family:"JetBrains Mono",monospace;}
  #q:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(45,226,230,.15);}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{font-family:"JetBrains Mono",monospace; font-size:11px; padding:7px 12px; border-radius:999px;
    border:1px solid var(--line); color:var(--muted); cursor:pointer; user-select:none; transition:.15s; background:var(--panel);}
  .chip:hover{color:var(--ink); border-color:var(--cyan)}
  .chip.on{color:#04101a; background:var(--cyan); border-color:var(--cyan); font-weight:700; box-shadow:0 0 14px rgba(45,226,230,.4);}

  .cat{margin:34px 0 10px; display:flex; align-items:center; gap:12px;}
  .cat h2{font-family:"JetBrains Mono",monospace; font-size:15px; letter-spacing:1px; color:var(--cyan);
    margin:0; text-transform:uppercase;}
  .cat .ln{flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent);}
  .cat .cnt{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--muted);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; margin-top:14px;}
  .card{background:linear-gradient(160deg,var(--panel2),var(--panel)); border:1px solid var(--line);
    border-radius:14px; padding:15px 16px; position:relative; overflow:hidden; transition:.16s;}
  .card::after{content:""; position:absolute; inset:0; border-radius:14px; pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(45,226,230,0); transition:.16s;}
  .card:hover{transform:translateY(-3px); border-color:rgba(45,226,230,.5);
    box-shadow:0 14px 36px rgba(0,0,0,.5), 0 0 22px rgba(45,226,230,.12);}
  .card h3{margin:0 0 6px; font-size:15px; font-family:"JetBrains Mono",monospace;}
  .card h3 a{color:var(--ink); text-decoration:none;}
  .card h3 a:hover{color:var(--cyan);}
  .card .desc{color:var(--muted); font-size:12.5px; line-height:1.55; margin:0 0 11px; min-height:34px;}
  .card .meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .tag{font-family:"JetBrains Mono",monospace; font-size:10px; padding:3px 8px; border-radius:6px;
    border:1px solid var(--line); color:var(--muted);}
  .tag.lic{color:var(--green); border-color:rgba(57,217,138,.3)}
  .tag.src a{color:var(--purple); text-decoration:none; border-color:rgba(177,74,237,.35)}
  .tag.src a:hover{color:#fff}
  .empty{color:var(--muted); text-align:center; padding:60px 0; font-family:"JetBrains Mono",monospace;}
  footer{margin-top:60px; text-align:center; color:var(--muted); font-family:"JetBrains Mono",monospace; font-size:12px;}
  footer a{color:var(--cyan); text-decoration:none}
  @media(max-width:560px){.stats{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand"><span class="os">SELFHOST</span><span class="dot">.</span>OS</div>
      <h1>Run it yourself.</h1>
      <p class="tagline">A curated index of self-hostable Free Software. Only live links — dead
        ones filtered out. Own your stack, own your data.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <input id="q" placeholder="filter by name, tag, description…" autocomplete="off"/>
    <div class="chips" id="chips"></div>
  </div>

  <div id="out"></div>
  <div class="empty" id="empty" style="display:none">no matches — try another filter.</div>

  <footer>
    SELFHOST.OS · built from the awesome-selfhosted data · only live links ·
    <a href="https://github.com/qapdex-maker/awesome-selfhosted">github</a>
  </footer>
</div>

<script src="data.js"></script>
<script>
const DATA = window.SELFHOST_DATA || [];
const out = document.getElementById('out');
const empty = document.getElementById('empty');
const stats = document.getElementById('stats');
const chips = document.getElementById('chips');
const q = document.getElementById('q');

// build category filter chips
const cats = DATA.map(c => c.name);
let active = new Set();
cats.slice(0, 14).forEach(name => {
  const c = document.createElement('span');
  c.className = 'chip'; c.textContent = name;
  c.onclick = () => window.location.hash = '';
  c.onclick = () => { active.has(name) ? active.delete(name) : active.add(name); render(); };
  chips.appendChild(c);
});

function card(item){
  const el = document.createElement('div'); el.className = 'card';
  const tags = (item.tags||[]).map((t,i) =>
     i===0 ? `<span class="tag lic">${t}</span>` : `<span class="tag">${t}</span>`).join('');
  const src = item.src ? `<span class="tag src"><a href="${item.src}" target="_blank" rel="noopener">src</a></span>` : '';
  el.innerHTML = `<h3><a href="${item.url}" target="_blank" rel="noopener">${item.name}</a></h3>
    <p class="desc">${item.desc||''}</p>
    <div class="meta">${tags}${src}</div>`;
  return el;
}

function render(){
  const term = q.value.trim().toLowerCase();
  out.innerHTML = '';
  let total = 0, shownCats = 0;
  DATA.forEach(cat => {
    if (active.size && !active.has(cat.name)) return;
    const items = cat.items.filter(it => {
      if (!term) return true;
      return (it.name+ ' ' + (it.desc||'') + ' ' + (it.tags||[]).join(' ')).toLowerCase().includes(term);
    });
    if (!items.length) return;
    total += items.length; shownCats++;
    const sec = document.createElement('div'); sec.className = 'cat';
    sec.innerHTML = `<h2>${cat.name}</h2><span class="ln"></span><span class="cnt">${items.length}</span>`;
    out.appendChild(sec);
    const grid = document.createElement('div'); grid.className = 'grid';
    items.forEach(it => grid.appendChild(card(it)));
    out.appendChild(grid);
  });
  empty.style.display = total ? 'none' : 'block';
  stats.innerHTML = `<b>${total}</b> tools · ${shownCats} cats<br/>${DATA.length} total categories`;
  // sync chip highlight
  [...chips.children].forEach(ch => ch.classList.toggle('on', active.has(ch.textContent)));
}

q.addEventListener('input', render);
render();
</script>
</body>
</html>
